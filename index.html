  <!-- Fonts + Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --bg-deep: #050b14;
      --bg-mid: #0a1628;
      --emerald: #00e08a;
      --emerald-dark: #00b36b;
      --gold: #ffc93c;
      --text-light: #e8eef7;
      --text-muted: #9fb0c3;
      --glass: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(0, 224, 138, 0.18);
    }

    body {
      font-family: 'Poppins', sans-serif;
      margin: 0; padding: 0;
      background: radial-gradient(circle at 20% 10%, #0d1f33 0%, #050b14 55%, #02060b 100%);
      color: var(--text-light);
      position: relative;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* subtle grid / candlestick backdrop */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 224, 138, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 224, 138, 0.045) 1px, transparent 1px);
      background-size: 42px 42px;
      pointer-events: none;
      z-index: 0;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      position: relative;
      z-index: 1;
    }

    .glass-box {
      background: linear-gradient(160deg, rgba(10, 22, 40, 0.85), rgba(5, 11, 20, 0.9));
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      padding: 42px 26px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55), 0 0 60px rgba(0, 224, 138, 0.06) inset;
      backdrop-filter: blur(12px);
      max-width: 660px;
      width: 100%;
    }

    .logo img {
      width: 120px; height: 120px;
      border-radius: 50%;
      border: 3px solid var(--gold);
      object-fit: cover;
      margin-bottom: 20px;
      transition: transform 0.3s ease;
      box-shadow: 0 0 25px rgba(255, 201, 60, 0.35);
    }
    .logo img:hover {
      transform: scale(1.08);
    }

    h1 {
      font-weight: 700;
      color: var(--gold);
      font-size: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-shadow: 0 0 20px rgba(255, 201, 60, 0.25);
    }

    .crown {
      color: var(--gold);
      animation: shine 2s infinite linear;
    }
    @keyframes shine {
      0% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
      100% { opacity: 0.6; transform: scale(1); }
    }

    h2 {
      font-weight: 600;
      margin-top: 30px;
      color: var(--emerald);
    }

    p {
      color: var(--text-muted);
      margin: 10px 0;
      font-size: 16px;
    }

    /* live ticker strip */
    .ticker {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: 16px 0 4px;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.4px;
    }
    .ticker span {
      background: rgba(0, 224, 138, 0.08);
      border: 1px solid rgba(0, 224, 138, 0.22);
      color: var(--emerald);
      padding: 5px 12px;
      border-radius: 30px;
    }
    .ticker span.down {
      color: #ff6b6b;
      background: rgba(255, 107, 107, 0.07);
      border-color: rgba(255, 107, 107, 0.25);
    }

    a.cta-btn {
      background: linear-gradient(90deg, var(--emerald-dark), var(--emerald));
      padding: 15px 42px;
      border-radius: 50px;
      font-size: 18px;
      color: #03110b;
      font-weight: 700;
      display: inline-block;
      margin: 20px 0;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 6px 22px rgba(0, 224, 138, 0.38);
      animation: pulse 1.6s infinite;
      cursor: pointer;
    }
    a.cta-btn:hover {
      color: #03110b;
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0, 224, 138, 0.55);
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(0, 224, 138, 0.55); }
      70% { box-shadow: 0 0 0 20px rgba(0, 224, 138, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 224, 138, 0); }
    }

    .highlight {
      color: var(--emerald);
      font-weight: 600;
    }

    .stats {
      display: flex;
      justify-content: center;
      margin: 22px 0;
      flex-wrap: wrap;
      gap: 12px;
    }
    .stat-box {
      background: rgba(255, 201, 60, 0.07);
      border: 1px solid rgba(255, 201, 60, 0.22);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      color: var(--gold);
    }

    .benefits {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 22px 0 6px;
    }
    .benefit-card {
      background: rgba(0, 224, 138, 0.04);
      border: 1px solid rgba(0, 224, 138, 0.14);
      padding: 13px 16px;
      border-radius: 12px;
      text-align: left;
      font-size: 15px;
      color: var(--text-light);
      transition: all 0.25s ease;
    }
    .benefit-card:hover {
      background: rgba(0, 224, 138, 0.09);
      border-color: rgba(0, 224, 138, 0.35);
      transform: translateX(4px);
    }
    .benefit-card i {
      margin-right: 8px;
    }

    footer {
      margin-top: 20px;
      font-size: 13px;
      color: #6d7f92;
    }

    .ad-manage-tag {
      position: fixed;
      bottom: 10px;
      right: 12px;
      font-size: 10px;
      color: #7f8ea0;
      background: rgba(5, 11, 20, 0.6);
      padding: 4px 10px;
      border-radius: 30px;
      backdrop-filter: blur(6px);
      z-index: 999;
      font-weight: 400;
      letter-spacing: 0.3px;
      border: 1px solid rgba(0, 224, 138, 0.12);
      transition: all 0.3s ease;
      text-decoration: none;
      pointer-events: none;
    }
    .ad-manage-tag i {
      font-size: 9px;
      margin-right: 4px;
      color: var(--gold);
    }
  </style>
</head>
<body>

  <!-- Easy Variables -->
  <script>
    const SITE_NAME = "TRADE FINDER";
    const SITE_IMAGE = "https://karanmetalabe.com/wp-content/uploads/2026/05/wordpress_optimized_image.jpg";

      <div class="benefits">
        <div class="benefit-card"><i class="fa-solid fa-chart-line highlight"></i> Live Market Insights &amp; Discussions</div>

        <div class="benefit-card"><i class="fa-solid fa-bullseye highlight"></i> Practical Strategies &amp; Setups</div>
      </div>

      <footer>Trade smart. Learn daily. Grow consistently.</footer>
    </div>
  </section>

  <!-- Tiny side text: Ad manage by Karan Agency -->
  <div class="ad-manage-tag">
    <i class="fa-solid fa-bolt"></i> Ad manage by Karan Agency
  </div>

  <!-- Auto Apply Variables -->
  <script>
    document.getElementById("site-title").innerText = SITE_NAME;
    document.getElementById("site-heading").innerHTML =
      `<i class="fa-solid fa-crown crown"></i> ${SITE_NAME} <i class="fa-solid fa-crown crown"></i>`;
    document.getElementById("site-logo").src = SITE_IMAGE;

    const ctaBtn1 = document.getElementById("cta-btn-1");
    ctaBtn1.href = TELEGRAM_LINK;
  </script>

</body>
</html>
